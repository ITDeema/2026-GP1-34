# Updates the data files every 6 months, counted from the date of the data in the repository
# (backend/data/data_version.json), so every computer and the hosting server use the same files.
#   * runs once a day; does nothing until 6 months have passed since that date
#   * "Run workflow" (Actions tab) with force = true updates now
#   * the small files are committed to main; the large files (parcels, OpenStreetMap) are published as the
#     release "data-<date>", and the backend downloads them from there (backend/local_data.py, sync_release_files)
name: Update data (every 6 months)

on:
  schedule:
    - cron: "17 2 * * *"   # every day at 02:17 UTC (05:17 Riyadh)
  workflow_dispatch:
    inputs:
      force:
        description: "Update now, even before 6 months"
        type: boolean
        default: false

permissions:
  contents: write   # commit the files and create the release

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Is an update due?
        id: due
        shell: bash
        run: |
          if [ "${{ inputs.force }}" = "true" ] || [ ! -f backend/data/data_version.json ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(python3 -c "import json; print(json.load(open('backend/data/data_version.json'))['version'])")
          next=$(date -d "$last +6 months" +%F)
          echo "last update $last, next $next"
          if [ "$(date +%F)" \< "$next" ]; then echo "due=false" >> "$GITHUB_OUTPUT"; else echo "due=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.due.outputs.due == 'true'
        with:
          python-version: "3.12"

      - name: Install the tools
        if: steps.due.outputs.due == 'true'
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y osmium-tool
          pip install -q geopandas shapely pyarrow requests overturemaps duckdb boto3

      - name: Download and build the files
        if: steps.due.outputs.due == 'true'
        id: build
        working-directory: backend
        run: |
          python tools/update_data.py --force | tee update.log
          echo "version=$(grep '^version=' update.log | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Publish the large files (parcels, OpenStreetMap) as a release
        if: steps.due.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="data-${{ steps.build.outputs.version }}"
          gh release create "$tag" backend/data/riyadh_parcels_all.parquet backend/data/riyadh_osm.parquet \
            backend/data/data_version.json \
            --title "Data ${{ steps.build.outputs.version }}" \
            --notes "Data files of ${{ steps.build.outputs.version }} (next update in 6 months). The small files are in backend/data on main."

      - name: Commit the small files
        if: steps.due.outputs.due == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add backend/data/data_version.json backend/data/riyadh_streets.parquet \
                  backend/data/overture_places_riyadh.parquet backend/data/pois_riyadh_merged.parquet
          git commit -m "Update data files (${{ steps.build.outputs.version }})"
          git push
